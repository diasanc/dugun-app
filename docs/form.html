<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Düğün RSVP — LIERA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  font-family:'DM Sans',sans-serif;
  color:#1a0533;
  overflow:hidden;
}
.bg{
  position:fixed;
  inset:0;
  z-index:0;
  background:linear-gradient(135deg,#FFF0F3 0%,#FFCDD8 100%);
}
.card{
  position:relative;
  z-index:10;
  max-width:420px;
  width:100%;
  border-radius:24px;
  padding:36px 28px 32px;
  backdrop-filter:blur(40px) saturate(160%);
  -webkit-backdrop-filter:blur(40px) saturate(160%);
  background:linear-gradient(145deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.20) 100%);
  border:1px solid rgba(255,255,255,0.6);
  box-shadow:0 8px 40px rgba(93,63,211,0.10),0 2px 8px rgba(93,63,211,0.06),inset 0 1px 0 rgba(255,255,255,0.7);
  animation:cardIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(32px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.brand{text-align:center;margin-bottom:20px;animation:fadeIn 0.8s ease both;animation-delay:0.15s;opacity:0}
.brand-name{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.22em;color:rgba(93,63,211,0.55);text-transform:uppercase}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.content-wrap{animation:fadeIn 0.8s ease both;animation-delay:0.25s;opacity:0}
h1{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;color:#3a0a6e;text-align:center;line-height:1.15;margin-bottom:6px}
.sub{text-align:center;font-size:13px;color:rgba(80,40,130,0.6);margin-bottom:6px}
.date-wrap{text-align:center;margin-bottom:18px}
.date-badge{display:inline-block;font-size:11px;font-weight:600;color:rgba(93,63,211,0.8);background:rgba(93,63,211,0.10);border:1px solid rgba(93,63,211,0.2);border-radius:20px;padding:4px 14px;letter-spacing:0.04em}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(93,63,211,0.2),transparent);margin:18px 0}
.field{margin-bottom:20px}
label.lbl{display:block;font-size:10px;font-weight:700;color:rgba(93,63,211,0.55);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px}
input[type=text],input[type=tel]{width:100%;padding:12px 14px;background:rgba(255,255,255,0.4);border:1px solid rgba(93,63,211,0.2);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;color:#2a0856;outline:none;transition:all 0.25s}
input[type=text]::placeholder,input[type=tel]::placeholder{color:rgba(93,63,211,0.35)}
input[type=text]:focus,input[type=tel]:focus{background:rgba(255,255,255,0.65);border-color:rgba(93,63,211,0.5);box-shadow:0 0 0 3px rgba(93,63,211,0.08);transform:translateY(-1px)}
.rg{display:flex;gap:8px;flex-wrap:wrap}
.ro input{display:none}
.ro label{display:flex;align-items:center;gap:5px;padding:9px 16px;background:rgba(255,255,255,0.35);border:1px solid rgba(93,63,211,0.2);border-radius:50px;cursor:pointer;font-size:13px;font-weight:500;color:rgba(80,40,130,0.7);transition:all 0.18s}
.ro label:hover{background:rgba(93,63,211,0.08);border-color:rgba(93,63,211,0.35);transform:translateY(-1px)}
.ro input:checked+label{background:#5D3FD3;border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(93,63,211,0.3);transform:translateY(-1px)}
.cpn{margin-bottom:20px;display:none}
.cpn.show{display:block;animation:slideDown 0.3s ease both}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
input[type=number]{width:90px;padding:9px 12px;background:rgba(255,255,255,0.4);border:1px solid rgba(93,63,211,0.2);border-radius:12px;font-size:14px;color:#2a0856;font-family:'DM Sans',sans-serif;outline:none;transition:all 0.25s}
input[type=number]:focus{border-color:rgba(93,63,211,0.5);box-shadow:0 0 0 3px rgba(93,63,211,0.08)}
.btn{width:100%;padding:16px;background:#5D3FD3;color:#fff;border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.08em;cursor:pointer;margin-top:8px;transition:all 0.2s;box-shadow:0 6px 20px rgba(93,63,211,0.3);position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.12) 0%,transparent 60%);pointer-events:none}
.btn:hover{opacity:0.92;transform:translateY(-2px);box-shadow:0 10px 28px rgba(93,63,211,0.38)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.err{background:rgba(186,26,26,0.08);color:#a00020;border:1px solid rgba(186,26,26,0.15);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px;animation:fadeIn 0.3s ease both}
.ok-circle{width:96px;height:96px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:popIn 0.5s cubic-bezier(0.16,1,0.3,1) both}
@keyframes popIn{from{opacity:0;transform:scale(0.6)}to{opacity:1;transform:scale(1)}}
.powered{text-align:center;margin-top:22px;font-size:11px;color:rgba(93,63,211,0.4);font-weight:500;letter-spacing:0.05em}
.powered strong{color:rgba(93,63,211,0.65);font-weight:700;letter-spacing:0.12em}
#loading{text-align:center;color:rgba(93,63,211,0.55);font-size:14px;padding:40px 0}
 
</style>
</head>
<body>
<div class="bg"></div>
<div class="card" id="root"><div id="loading">Yükleniyor…</div></div>
 
<script>
// ── Supabase ───────────────────────────────────────────────
const SUPABASE_URL='https://vwcochhjzdgiiczdvico.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3Y29jaGhqemRnaWljemR2aWNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NjU4NzMsImV4cCI6MjA5ODI0MTg3M30.yRMbjY6fU4GheyysEoZATyVItKZhc-1sbGozH7MHLGE';
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const root=document.getElementById('root');
const params=new URLSearchParams(window.location.search);
const wid=params.get('wid')||'';
 
function dbHeaders(){return{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':'application/json'}}
 
function fmtDate(d){
  const m=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const [y,mo,day]=d.split('-').map(Number);
  return day+' '+m[mo-1]+' '+y;
}
 
function showError(msg){
  root.innerHTML=`<div class="brand"><div class="brand-name">LIERA</div></div>
    <div style="text-align:center;margin-bottom:16px">
<svg viewBox="0 0 40 40" width="40" height="40" fill="none">
  <circle cx="20" cy="20" r="18" stroke="#a00020" stroke-width="1.5" fill="none"/>
  <line x1="20" y1="11" x2="20" y2="24" stroke="#a00020" stroke-width="2" stroke-linecap="round"/>
  <circle cx="20" cy="29" r="1.5" fill="#a00020"/>
</svg>
</div>
    <h1 style="color:#a00020;font-size:26px">Hata</h1>
    <p class="sub">${msg}</p>
    <div class="powered">Powered by <strong>LIERA</strong></div>`;
}
 
function showSuccess(fullName,status){
  const msgs={
    attending:'Düğünümüzde sizi görmek için sabırsızlanıyoruz! 🎉',
    declined:'Anlayışınız için teşekkür ederiz.',
    maybe:'Yanıtınızı ilettiğiniz için teşekkür ederiz.',
  };
  root.innerHTML=`<div class="brand"><div class="brand-name">LIERA</div></div>
    <div class="ok-circle">
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 1024 1024"><path fill="#6C5CE7" d="M365.801 295.04C369.074 295.913 376.229 298.662 379.671 299.886C389.66 303.437 401.778 307.486 411.17 312.334C408.125 326.576 401.662 348.568 397.62 362.877C402.21 363.459 407.111 362.959 411.21 364.681C413.136 367.124 410.662 385.983 410.218 390.425C414.23 389.8 424.834 389.984 429.278 389.986C458.494 390.264 478.367 397.003 504.348 408.952C505.944 409.889 508.343 411.156 510.024 411.964C517.574 416.784 524.382 421.198 531.344 426.929C600.384 483.759 609.702 575.614 550.658 644.359C526.823 672.558 494.313 692.061 458.213 699.815C376.053 717.694 285.761 662.607 268.682 579.173C260.578 539.584 269.02 498.094 291.107 464.337C299.931 451.062 310.699 439.188 323.051 429.112C325.976 426.687 335.824 419.338 337.779 417.248C318.498 410.755 318.276 410.242 327.264 394.097C317.886 390.727 306.704 384.658 297.546 380.297C292.21 377.757 282.935 373.618 278.359 370.764C277.392 367.86 287.504 333.044 289.25 327.694C292.609 325.876 296.91 324.213 300.468 322.736C322.281 313.676 343.837 303.706 365.801 295.04ZM432.946 668.975C470.84 666.031 498.917 651.999 524.09 623.163C544.961 599.256 556.374 567.213 553.823 535.364C551.112 504.254 536.179 475.488 512.297 455.369C489.223 435.767 451.056 421.307 420.53 424.704C316.599 433.983 256.993 549.846 332.641 630.455C359.346 658.911 394.437 669.787 432.946 668.975Z"/><path fill="#6C5CE7" d="M506.776 404.62C506.58 402.127 517.19 395.128 519.609 393.339C545.716 373.697 577.103 362.316 609.732 360.662C639.403 359.032 672.4 366.858 698.222 381.385C742.903 406.521 777.301 455.073 779.942 506.836C782.347 551.403 766.833 595.082 736.854 628.146C689.701 679.967 612.022 699.263 546.42 671.99C544.207 671.07 538.441 668.591 536.786 667.15L536.935 666.629C546.96 654.82 553.091 650.359 563.188 636.458C567.406 637.351 574.107 640.679 579.238 642.093C600.732 648.018 624.459 648.908 646.095 643.281C679.501 634.517 708.08 612.887 725.589 583.117C742.504 554.115 747.794 521.805 739.05 489.221C730.237 457.44 709.149 430.467 680.433 414.247C637.716 389.81 588.735 388.147 547.828 415.765C545.622 417.254 538.582 423.4 536.706 423.44C531.61 417.996 513.864 408.403 506.776 404.62Z"/></svg>
</div>
    <h1>Teşekkürler!</h1>
    <p class="sub" style="font-size:15px;margin-bottom:8px">${fullName}</p>
    <p class="sub">${msgs[status]||'Yanıtınız alındı.'}</p>
    <div class="divider"></div>
    <p style="text-align:center;font-size:13px;color:rgba(93,63,211,0.45)">Bu sayfayı kapatabilirsiniz.</p>
    <div class="powered">Powered by <strong>LIERA</strong></div>`;
 
}
 
function showForm(wedding){
  const title=wedding.title||'Düğün';
  const dateBadge=wedding.wedding_date?`<div class="date-wrap"><span class="date-badge">${fmtDate(wedding.wedding_date)}</span></div>`:'';
  document.title=title+' — RSVP';
  root.innerHTML=`
    <div class="brand"><div class="brand-name">LIERA</div></div>
    <div class="content-wrap">
      <h1>${title}</h1>
      <p class="sub">Düğünümüze katılımınızı bildirin</p>
      ${dateBadge}
      <div class="divider"></div>
      <div id="err-box"></div>
      <div class="field">
        <label class="lbl">Ad Soyad *</label>
        <input type="text" id="full_name" placeholder="Adınız Soyadınız" autocomplete="name">
      </div>
      <div class="field">
        <label class="lbl">Katılım Durumunuz *</label>
        <div class="rg">
          <div class="ro"><input type="radio" name="rsvp_status" id="att" value="attending"><label for="att">✓ Geliyor</label></div>
          <div class="ro"><input type="radio" name="rsvp_status" id="dec" value="declined"><label for="dec">✗ Gelmiyor</label></div>
          <div class="ro"><input type="radio" name="rsvp_status" id="mbe" value="maybe"><label for="mbe">? Belki</label></div>
        </div>
      </div>
      <div class="cpn" id="cpn">
        <label class="lbl">Yanında Kaç Kişi Geliyor? (+1)</label>
        <input type="number" id="companion_count" min="0" max="20" value="0">
      </div>
      <div class="field">
        <label class="lbl">Telefon (opsiyonel)</label>
        <input type="tel" id="phone" placeholder="05XX XXX XX XX" autocomplete="tel">
      </div>
      <button class="btn" id="submit-btn" onclick="submitRsvp()">Katılımımı Bildir</button>
      <div class="powered">Powered by <strong>LIERA</strong></div>
    </div>`;
 
  document.querySelectorAll('[name=rsvp_status]').forEach(r=>{
    r.addEventListener('change',()=>{
      const s=document.querySelector('[name=rsvp_status]:checked')?.value;
      document.getElementById('cpn').classList.toggle('show',s==='attending'||s==='maybe');
    });
  });
}
 
async function submitRsvp(){
  const fullName=document.getElementById('full_name').value.trim();
  const rsvpStatus=document.querySelector('[name=rsvp_status]:checked')?.value||'';
  const companionCount=Math.max(0,parseInt(document.getElementById('companion_count').value||'0',10)||0);
  const phone=document.getElementById('phone').value.trim();
  const errBox=document.getElementById('err-box');
 
  if(!fullName){errBox.innerHTML='<div class="err">Ad soyad alanı zorunludur.</div>';return;}
  if(!['attending','declined','maybe'].includes(rsvpStatus)){errBox.innerHTML='<div class="err">Lütfen bir katılım durumu seçin.</div>';return;}
 
  const btn=document.getElementById('submit-btn');
  btn.disabled=true;btn.textContent='Gönderiliyor…';errBox.innerHTML='';
 
  const res=await fetch(`${SUPABASE_URL}/rest/v1/guests`,{
    method:'POST',headers:dbHeaders(),
    body:JSON.stringify({wedding_id:wid,full_name:fullName,phone:phone||null,rsvp_status:rsvpStatus,companion_count:companionCount}),
  });
 
  if(!res.ok){
    btn.disabled=false;btn.textContent='Katılımımı Bildir';
    errBox.innerHTML='<div class="err">Bir hata oluştu. Lütfen tekrar deneyin.</div>';
    return;
  }
  showSuccess(fullName,rsvpStatus);
}
 
async function init(){
  if(!UUID_RE.test(wid)){showError('Geçersiz davet bağlantısı.');return;}
  const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_wedding_for_rsvp`,{
    method:'POST',
    headers:dbHeaders(),
    body:JSON.stringify({p_wedding_id:wid}),
  });
  if(!res.ok){showError('Bir hata oluştu.');return;}
  const data=await res.json();
  if(!data.length){showError('Düğün bulunamadı.');return;}
  showForm(data[0]);
}
init();
</script>
</body>
</html>
